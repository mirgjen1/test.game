<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser FPS Boilerplate</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Import map to use "three" and "three/addons/" as module specifiers -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- CSS Crosshair perfectly centered -->
    <div id="crosshair">
        <div class="crosshair-x"></div>
        <div class="crosshair-y"></div>
    </div>

    <!-- UI Overlay for starting the game and locking the pointer -->
    <div id="blocker">
        <div id="instructions">
            <span style="font-size:36px; font-weight: bold;">Click to Play</span>
            <br/><br/>
            Move: W, A, S, D<br/>
            Jump: SPACE<br/>
            Sprint: SHIFT<br/>
            Look: MOUSE
        </div>
    </div>

    <!-- Ammo Counter -->
    <div id="ammo-counter">30 / 30</div>

    <script type="module" src="main.js"></script>
    <script>
        // Show instructions and lock pointer on click
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            blocker.style.display = 'none';
            document.body.requestPointerLock();
        });

        // Show blocker if pointer is unlocked
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === null) {
                blocker.style.display = 'flex';
            }
        });
    </script>
    <script>
        // Update ammo counter for demonstration
        let ammo = 30;
        const ammoCounter = document.getElementById('ammo-counter');

        function updateAmmo(count) {
            ammo = Math.max(0, Math.min(30, count));
            ammoCounter.textContent = `${ammo} / 30`;
        }

        // Example: Decrease ammo every second for demonstration
        setInterval(() => {
            updateAmmo(ammo - 1);
        }, 1000);
    </script>
    <script>
        // FPS Counter
        const fpsCounter = document.createElement('div');
        fpsCounter.style.position = 'absolute';
        fpsCounter.style.top = '10px';
        fpsCounter.style.left = '10px';
        fpsCounter.style.color = 'white';
        fpsCounter.style.fontSize = '14px';
        fpsCounter.style.fontFamily = 'Arial, sans-serif';
        document.body.appendChild(fpsCounter);

        let lastTime = performance.now();
        let frameCount = 0;

        function updateFPS() {
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastTime));
                fpsCounter.textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = now;
            }
            requestAnimationFrame(updateFPS);
        }

        updateFPS();
    </script>
    <script type ="module" src="world.js"></script>
</body>
</html>
